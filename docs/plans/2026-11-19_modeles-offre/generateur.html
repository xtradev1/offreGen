<!doctype html>
<html lang="fr-CH">
<head>
<meta charset="utf-8">
<title>Générateur des douze modèles</title>
<!-- Source des feuilles A4 de MAQUETTE-modeles-v2.html. Ouvrir avec #m=<modele>&d=<jeu> pour une feuille, sans rien pour toutes.
     Dans .a4 : seulement ce que dompdf sait rendre (tableaux, flottants, position absolue, bordures, fonds).
     Les variables CSS (--p, --t) sont une facilité du générateur : l'application passe par les classes c-* de Marque::css().
     Données inventées : entreprises, clients, prix, IDE, IBAN. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400;1,600&display=block" rel="stylesheet">
<style>
body { margin: 0; background: #cfd4da; }
.pile { padding: 20px; }
.pile .a4 { margin: 0 auto 24px; }
body.une { background: #fff; }

/* ===== Commun ===== */

.a4 .t { background: var(--t); }

.a4 .lig .pos { width: 38px; color: #4b525b; }

.a4 .opt { margin-top: 14px; }

.m-sobre .lig th.n, .m-chantier .lig th.n, .a4 .opt td.n { width: 112px; }
.a4 .opt th { font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; padding: 6px; border-top: 1.5px solid #1b1f24; border-bottom: 1px solid #1b1f24; }
.a4 .opt td { padding: 4.5px 6px; border-bottom: 1px solid #e3e6ea; }

/* ===== 1 Sobre ===== */

.m-atelier .pied { left: 76px; width: 642px; text-align: center; }

/* ===== 4 Technique ===== */

.m-technique .cart { border: 1.5px solid #1b1f24; margin: 6px 0 16px; }

}

const coord = e => `<b>${e.nom}</b><br>${e.rue}<br>${e.lieu}<br>${e.tel}<br>${e.mail}`;
const adresse = o => o.client.join('<br>');
const infos = cells => `<table class="infos"><tr>${cells.map(([l, v]) => `<td><div class="lab">${l}</div>${v}</td>`).join('')}</tr></table>`;
function lignes(o, { pos = false, unite = false, st = true, grpTot = false, zebre = false } = {}) {
  const cols = (pos ? 1 : 0) + 4 + (unite ? 1 : 0);
  let h = `<table class="lig"><thead><tr>${pos ? '<th class="pos">Pos.</th>' : ''}<th>Désignation</th><th class="n">Quantité</th>${unite ? '<th class="u">Un.</th>' : ''}<th class="n">Prix unit.</th><th class="n">Montant</th></tr></thead><tbody>`;
  o.g.forEach((g, gi) => {
    if (g.nom) h += `<tr class="grp"><td colspan="${grpTot ? cols - 1 : cols}">${pos ? (gi + 1) + NB + NB : ''}${g.nom}</td>${grpTot ? `<td class="n">${chf(g.tot)}</td>` : ''}</tr>`;
    g.l.forEach((x, li) => {
      h += `<tr${zebre && li % 2 === 0 ? ' class="z"' : ''}>${pos ? `<td class="pos">${gi + 1}.${li + 1}</td>` : ''}<td>${x.d}</td><td class="n q">${qte(x.q)}${unite ? '' : NB + x.u}</td>${unite ? `<td class="u">${x.u}</td>` : ''}<td class="n">${chf(x.p * 100)}</td><td class="n">${chf(Math.round(x.q * x.p * 100))}</td></tr>`;
      // Variante : sous la ligne qu'elle remplace, hors total, avec l'écart de prix. Dessinée pour les tableaux à quatre colonnes.
      if (x.v) { const ecart = Math.round(x.q * (x.v.p - x.p) * 100); h += `<tr class="var"><td><span class="case"></span>Variante${NB}: ${x.v.d}<div class="met">${ecart >= 0 ? 'Plus-value' : 'Moins-value'} par rapport à la ligne du dessus</div></td><td class="n">${qte(x.q)}${NB}${x.u}</td><td class="n">${chf(x.v.p * 100)}</td><td class="n">${ecart >= 0 ? '+' : ''}${chf(ecart)}</td></tr>`; }
    });
    if (st && !grpTot && g.nom && g.l.length > 1) h += `<tr class="st"><td colspan="${cols - 1}">Total ${g.nom.toLowerCase()}</td><td class="n">${chf(g.tot)}</td></tr>`;
  });
  return h + '</tbody></table>';
}
const totaux = (T, cls = 'totaux') => `<table class="${cls}"><tr><td>Sous-total HT</td><td class="n">${chf(T.ht)}</td></tr><tr${T.arrondi ? '' : ' class="av"'}><td>TVA 8,1${NB}%</td><td class="n">${chf(T.tva)}</td></tr>${T.arrondi ? `<tr class="av"><td>Arrondi</td><td class="n">${chf(T.arrondi)}</td></tr>` : ''}<tr class="tt"><td>Total TTC</td><td class="n">CHF${NB}${chf(T.ttc)}</td></tr></table>`;
const options = (o, T) => !o.options ? '' : `<table class="opt"><thead><tr><th colspan="4">Options, hors total · cochez celles que vous retenez</th></tr></thead><tbody>${o.options.map(x => `<tr><td><span class="case"></span>${x.d}</td><td class="n">${qte(x.q)}${NB}${x.u}</td><td class="n">${chf(x.p * 100)}</td><td class="n">${chf(Math.round(x.q * x.p * 100))}</td></tr>`).join('')}<tr class="ot"><td colspan="3" class="n">Total TTC avec toutes les options</td><td class="n">CHF${NB}${chf(T.ttcOptions)}</td></tr></tbody></table>`;
// Sans cellule fusionnée : dompdf décale les colonnes quand une fusion passe d'une page à l'autre (essai du 2026-11-20).
function lignesMarge(o) {
  let h = '<table class="lig"><thead><tr><th class="po">Poste</th><th>Désignation</th><th class="n">Quantité</th><th class="n">Prix unit.</th><th class="n">Montant</th></tr></thead><tbody>';
  o.g.forEach(g => g.l.forEach((x, li) => {
    const cl = [li ? '' : 'prem', li === g.l.length - 1 ? 'fin' : ''].join(' ').trim();
    h += `<tr${cl ? ` class="${cl}"` : ''}><td class="po">${li === 0 ? `<b class="c">${g.nom}</b>${g.l.length === 1 ? '<br>' + chf(g.tot) : ''}` : li === 1 ? chf(g.tot) : ''}</td><td>${x.d}</td><td class="n">${qte(x.q)}${NB}${x.u}</td><td class="n">${chf(x.p * 100)}</td><td class="n">${chf(Math.round(x.q * x.p * 100))}</td></tr>`;
  }));
  return h + '</tbody></table>';
}
const cond = o => `<table class="cond"><tr><td><div class="lab">Conditions</div><ul><li>Paiement${NB}: ${o.paiement.replace(/ %/g, NB + '%')}.</li><li>Début des travaux${NB}: ${o.debut}. Durée${NB}: ${o.duree}.</li><li>Offre valable jusqu'au ${VALIDE}. Prix en francs suisses, TVA comprise dans le total.</li></ul></td><td><div class="lab">Non compris</div><ul>${o.non.map(x => `<li>${x}</li>`).join('')}</ul></td></tr></table>`;
const condPile = o => `<div class="condp"><div class="lab">Conditions</div><ul><li>Paiement${NB}: ${o.paiement.replace(/ %/g, NB + '%')}.</li><li>Début des travaux${NB}: ${o.debut}. Durée${NB}: ${o.duree}.</li><li>Offre valable jusqu'au ${VALIDE}. Prix en francs suisses, TVA comprise dans le total.</li></ul><div class="lab">Non compris</div><ul>${o.non.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
const sign = (e) => `<table class="sign"><tr><td><div class="lab">L'entreprise</div><div class="sig-nom">${e.contact}</div><div class="sig-l"></div><div class="sig-s">${e.nom}, ${e.lieu.replace(/^\d+ /, '')}, le ${DATE}</div></td><td><div class="lab">Bon pour accord</div><div class="sig-esp"></div><div class="sig-l"></div><div class="sig-s">Lieu, date et signature du client</div></td></tr></table>`;
const pied = e => `<table class="pied"><tr><td>${e.nom} · ${e.ide} TVA · IBAN ${e.iban}</td><td class="n">Page 1 / 1</td></tr></table>`;
const tete = (e, p, opt) => `<table class="h"><tr><td>${logo(e, p, opt)}</td><td class="coord">${coord(e)}</td></tr></table>`;
const quatre = (o, e) => infos([['Date', DATE], ["Valable jusqu'au", VALIDE], ['Chantier', o.chantier], ['Votre contact', e.contact]]);

/* ---------- Les douze modèles ---------- */
const MODELES = {
  sobre: { nom: 'Sobre', jeu: 'morel', rend: (o, e, T, p) => `<div class="in">${tete(e, p)}<div class="filet bg"></div><div class="adr">${adresse(o)}</div>
    <p class="titre c">Offre n°${NB}${o.num}</p><p class="objet">${o.titre}</p>${quatre(o, e)}${lignes(o)}${totaux(T)}${options(o, T)}${cond(o)}${sign(e)}</div>${pied(e)}` },

  bandeau: { nom: 'Bandeau', jeu: 'macon', rend: (o, e, T, p) => `<div class="bande bg"><div class="carte">${logo(e, p, { largeur: 262 })}</div><div class="coord">${coord(e)}</div></div>
    <div class="in"><div class="adr">${adresse(o)}</div><p class="sur c">Offre <span>n°${NB}${o.num}</span></p><p class="objet">${o.titre}</p>${quatre(o, e)}${lignes(o)}${totaux(T)}${cond(o)}${sign(e)}</div>
    <table class="bas bg"><tr><td>${e.nom} · ${e.ide} TVA · IBAN ${e.iban}</td><td class="n">Page 1 / 1</td></tr></table>` },

  atelier: { nom: 'Atelier', jeu: 'menuisier', rend: (o, e, T, p) => `<div class="in"><div class="centre">${logo(e, p, { police: "'Source Serif 4', Georgia, serif", graisse: 600, taille: 21, largeur: 330 })}</div>
    <div class="ligne-coord">${e.rue} · ${e.lieu} · ${e.tel} · ${e.mail}</div><div class="double"></div>
    <table class="tetiere"><tr><td><p class="titre c">Offre</p><p class="num">n°${NB}${o.num}</p></td><td><div class="adr">${adresse(o)}</div></td></tr></table>
    <p class="objet">${o.titre}</p><p class="meta">${e.lieu.replace(/^\d+ /, '')}, le ${DATE_LONGUE} · valable jusqu'au ${VALIDE} · chantier${NB}: ${o.chantier}</p>
    ${lignes(o)}${totaux(T)}${cond(o)}${sign(e)}</div>${pied(e)}` },

  technique: { nom: 'Technique', jeu: 'sanitaire', rend: (o, e, T, p) => `<div class="in">${tete(e, p)}<div class="adr">${adresse(o)}</div>
    <table class="cart"><tr><td colspan="5" class="gros"><b class="c">OFFRE</b>${NB}${NB} ${o.titre}</td></tr>
    <tr><td><div class="lab">N°</div>${o.num}</td><td><div class="lab">Date</div>${DATE}</td><td><div class="lab">Valable jusqu'au</div>${VALIDE}</td><td><div class="lab">Chantier</div>${o.chantier}</td><td><div class="lab">Contact</div>${e.contact}</td></tr></table>
    ${lignes(o, { pos: true, unite: true })}${totaux(T)}${cond(o)}${sign(e)}</div>${pied(e)}` },

  moderne: { nom: 'Moderne', jeu: 'sols', rend: (o, e, T, p) => `<div class="in">${tete(e, p)}<div class="adr">${adresse(o)}</div>
    <p class="titre">Offre</p><p class="objet">${o.titre}</p>${infos([['N°', o.num], ['Date', DATE], ["Valable jusqu'au", VALIDE], ['Chantier', o.chantier]])}
    ${lignes(o, { zebre: true, grpTot: true })}${totaux(T)}${cond(o)}${sign(e)}</div>${pied(e)}` },

  epure: { nom: 'Épuré', jeu: 'paysagiste', rend: (o, e, T, p) => `<div class="in">${tete(e, p, { graisse: 700 })}<div class="adr">${adresse(o)}</div>
    <div class="trait bg"></div><p class="titre">Offre n°${NB}${o.num}</p><p class="objet">${o.titre}</p><p class="meta">${DATE} · valable jusqu'au ${VALIDE} · chantier${NB}: ${o.chantier}</p>
    ${lignes(o, { grpTot: true })}${totaux(T)}${cond(o)}${sign(e)}</div>${pied(e)}` },

  chantier: { nom: 'Chantier', jeu: 'platrier', rend: (o, e, T, p) => `<div class="in">${tete(e, p)}<div class="barre bg"></div>
    <table class="duo"><tr><td><table class="fiche"><tr><th colspan="2">Chantier</th></tr><tr><td>Adresse</td><td>${o.chantier}</td></tr><tr><td>Contact sur place</td><td>${o.surplace}</td></tr><tr><td>Accès</td><td>${o.acces}</td></tr><tr><td>Début des travaux</td><td>${o.debut}</td></tr><tr><td>Durée estimée</td><td>${o.duree}</td></tr></table></td>
    <td><div class="adr">${adresse(o)}</div><p class="ref">Offre n°${NB}${o.num} du ${DATE}<br>Valable jusqu'au ${VALIDE}<br>Votre contact${NB}: ${e.contact}</p></td></tr></table>
    <p class="titre"><span>Offre</span> · ${o.titre}</p>${lignes(o, { grpTot: true })}${totaux(T)}${options(o, T)}${cond(o)}${sign(e)}</div>${pied(e)}` },

  recap: { nom: 'Récapitulatif', jeu: 'renovation', rend: (o, e, T, p) => `<div class="in">${tete(e, p)}<div class="filet"></div><div class="adr">${adresse(o)}</div>
    <p class="titre"><span>Offre n°${NB}${o.num}</span> · ${o.titre}</p><p class="meta">${DATE} · valable jusqu'au ${VALIDE} · chantier${NB}: ${o.chantier} · votre contact${NB}: ${e.contact}</p>
    <table class="duo2"><tr><td class="g"><p class="h2">Récapitulatif</p><table class="rec">${o.g.map((g, i) => `<tr><td class="let"><table class="pas"><tr><td>${'ABCDEFGH'[i]}</td></tr></table></td><td>${g.nom}</td><td class="n">${chf(g.tot)}</td></tr>`).join('')}</table></td>
    <td><p class="h2">&nbsp;</p>${totaux(T, 'bloc-tot')}</td></tr></table>
    <p class="h2" style="margin-top:16px">Détail des travaux</p>${lignes({ g: o.g.map((g, i) => ({ ...g, nom: 'ABCDEFGH'[i] + NB + '·' + NB + g.nom })) }, { st: false })}
    ${cond(o)}${sign(e)}</div>${pied(e)}` },

  lateral: { nom: 'Latéral', jeu: 'electricien', rend: (o, e, T, p) => `<div class="cote"><div class="carte">${logo(e, p, { largeur: 170, taille: 24 })}</div>
    <div class="bloc"><div class="lab">Offre</div><div class="gros">${o.num}</div></div>
    <div class="bloc"><div class="lab">Date</div>${DATE}</div><div class="bloc"><div class="lab">Valable jusqu'au</div>${VALIDE}</div>
    <div class="bloc"><div class="lab">Chantier</div>${o.chantier}</div><div class="bloc"><div class="lab">Votre contact</div>${e.contact}<br>${e.tel}<br>${e.mail}</div>
    <div class="fond"><b>${e.nom}</b><br>${e.rue}<br>${e.lieu}<br>${e.ide} TVA<br>IBAN ${e.iban}</div></div>
    <div class="in"><div class="adr">${adresse(o)}</div><p class="titre">${o.titre}</p>${lignes(o)}${totaux(T)}${condPile(o)}${sign(e)}</div>
    <table class="pied"><tr><td>&nbsp;</td><td class="n">Page 1 / 1</td></tr></table>` },

  enseigne: { nom: 'Enseigne', jeu: 'carreleur', rend: (o, e, T, p) => `<div class="in"><p class="ens c">${e.court}</p><p class="ens-s">${e.sous} · ${e.lieu.replace(/^\d+ /, '')}</p><div class="barre bg"></div>
    <p class="ens-c">${e.rue} · ${e.lieu} · ${e.tel} · ${e.mail}</p>
    <table class="duo"><tr><td><table class="ref"><tr><td>Offre n°</td><td><b>${o.num}</b></td></tr><tr><td>Date</td><td>${DATE}</td></tr><tr><td>Valable jusqu'au</td><td>${VALIDE}</td></tr><tr><td>Chantier</td><td>${o.chantier}</td></tr><tr><td>Votre contact</td><td>${e.contact}</td></tr></table></td><td><div class="adr">${adresse(o)}</div></td></tr></table>
    <p class="titre">${o.titre}</p>${lignes(o)}${totaux(T)}${cond(o)}${sign(e)}</div>${pied(e)}` },

  marge: { nom: 'Marge', jeu: 'facade', rend: (o, e, T, p) => `<div class="in">${tete(e, p)}<div class="filet"></div><div class="adr">${adresse(o)}</div>
    <p class="titre"><span>Offre n°${NB}${o.num}</span> · ${o.titre}</p>${quatre(o, e)}${lignesMarge(o)}${totaux(T)}${cond(o)}${sign(e)}</div>${pied(e)}` },

  lettre: { nom: 'Lettre', jeu: 'toiture', rend: (o, e, T, p) => `<div class="in">${tete(e, p)}
    <table class="env"><tr><td><div class="exp">${e.nom} · ${e.rue} · ${e.lieu}</div><div class="adr">${adresse(o)}</div></td><td class="lieu">${e.lieu.replace(/^\d+ /, '')}, le ${DATE_LONGUE}</td></tr></table>
    <p class="concerne"><span>Offre n°${NB}${o.num}</span>${NB}: ${o.titre.toLowerCase()}</p>
    <p class="txt">Monsieur,</p><p class="txt">Suite à notre visite du ${o.visite}, nous vous remettons notre offre pour les travaux suivants, à réaliser à la ${o.chantier}.</p>
    ${lignes(o)}${totaux(T)}
    <p class="txt apres">Les travaux peuvent débuter ${o.debut} et durent ${o.duree}. Paiement ${o.paiement}. Cette offre est valable jusqu'au ${VALIDE}. Ne sont pas compris${NB}: ${o.non.join(', ').toLowerCase()}.</p>
    <p class="txt">Nous restons à votre disposition pour toute question et vous adressons, Monsieur, nos salutations les meilleures.</p>
    <table class="sign"><tr><td>${e.nom}<div class="sig-nom">${e.contact}</div></td><td><div class="lab">Bon pour accord</div><div class="sig-esp"></div><div class="sig-l"></div><div class="sig-s">Lieu, date et signature du client</div></td></tr></table></div>${pied(e)}` },
};

function feuille(m, jeu) {
  const M = MODELES[m], J = JEUX[jeu || M.jeu];
  const o = copie(J.o), e = J.e;
  const T = totaliser(o), p = principale(e.couleur);
  return `<div class="a4 m-${m}" id="f-${m}-${jeu || M.jeu}" style="--p:${p};--t:${teinte(p, 0.9)};--t2:${teinte(p, 0.82)}">${M.rend(o, e, T, p)}</div>`;
}

const q = new URLSearchParams(location.hash.slice(1));
const pile = document.getElementById('pile');
if (q.get('m')) { document.body.classList.add('une'); pile.innerHTML = feuille(q.get('m'), q.get('d')); }
else pile.innerHTML = Object.keys(MODELES).map(m => feuille(m)).join('');
window.MODELES_CLES = Object.keys(MODELES);
</script>
</body>
</html>
